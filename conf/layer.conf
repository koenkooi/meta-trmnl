# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "trmnl-layer"
BBFILE_PATTERN_trmnl-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_trmnl-layer = "9"

# meta-trmnl's whole purpose is producing image-oci.bbclass output, so
# virtualization-layer is a hard dependency, not an optional one guarded
# by BBFILES_DYNAMIC the way meta-angstrom treats its own OCI feature.
# rubygems (github.com/priv-kweihmann/meta-rubygems) supplies the
# rubygems.bbclass cross-compile mechanism plus several gem recipes
# Terminus's native-extension gems reuse -- see recipes-trmnl/terminus.
LAYERDEPENDS_trmnl-layer = "core virtualization-layer rubygems"

LAYERSERIES_COMPAT_trmnl-layer = "wrynose"
